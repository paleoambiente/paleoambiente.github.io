<!-- SERVICIOS TÉCNICOS -->
<h2 class="section-title">Especialidades Técnicas</h2>

<div class="pillars-grid">
  <div class="pillar-card">
    <h3>🔍 Monitoreo Paleontológico en Obra</h3>
    <p>
      Presencia técnica directa en excavaciones y movimientos de tierra. Identificación en terreno de horizontes fosilíferos, control de hallazgos y gestión directa para evitar detenciones innecesarias.
    </p>
  </div>

  <div class="pillar-card">
    <h3>📜 Permisos & Rescates (CMN)</h3>
    <p>
      Elaboración de solicitudes de prospección y excavación (Art. 22 y 23 de la Ley N° 17.288), ejecución de planes de rescate, microexcavación y salvataje de material fosilífero.
    </p>
  </div>

  <div class="pillar-card">
    <h3>🗺️ Líneas de Base y Estratigrafía</h3>
    <p>
      Líneas de base paleontológicas y geológicas precisas para DIAs y EIAs. Levantamiento de columnas sedimentarias, cartografía y análisis de potencial fosilífero inobjetable.
    </p>
  </div>
</div>

